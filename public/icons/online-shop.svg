<svg preserveAspectRatio="none" width="100%" height="100%" overflow="visible" style="display: block;" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="online-shop">
  <!-- Awning / storefront top banner -->
  <path d="M14 22 L86 22 L86 32 L14 32 Z" fill="#83DFE8" fill-opacity="0.6"/>

  <!-- Awning scallops (bottom edge) -->
  <path d="M14 32 Q 21 38 28 32 Q 35 38 42 32 Q 49 38 56 32 Q 63 38 70 32 Q 77 38 84 32" fill="#83DFE8" fill-opacity="0.4"/>

  <!-- Shop body fill -->
  <path d="M20 32 L80 32 L80 86 L20 86 Z" fill="#E6F2F7" fill-opacity="0.3"/>

  <!-- Door fill (mint accent) -->
  <path d="M42 86 L42 60 Q 42 54 50 54 Q 58 54 58 60 L58 86 Z" fill="#5CEBBE" fill-opacity="0.8"/>

  <!-- Outlines: Awning -->
  <path d="M14 22 L86 22 L86 32 L14 32 Z" stroke="#027DB3" stroke-width="2.5" stroke-linejoin="round" fill="none"/>

  <!-- Awning vertical stripes -->
  <line x1="28" y1="22" x2="28" y2="32" stroke="#027DB3" stroke-width="1.5"/>
  <line x1="42" y1="22" x2="42" y2="32" stroke="#027DB3" stroke-width="1.5"/>
  <line x1="58" y1="22" x2="58" y2="32" stroke="#027DB3" stroke-width="1.5"/>
  <line x1="72" y1="22" x2="72" y2="32" stroke="#027DB3" stroke-width="1.5"/>

  <!-- Awning scallop outline -->
  <path d="M14 32 Q 21 38 28 32 Q 35 38 42 32 Q 49 38 56 32 Q 63 38 70 32 Q 77 38 84 32" stroke="#027DB3" stroke-width="2" stroke-linejoin="round" fill="none"/>

  <!-- Shop body outline -->
  <path d="M20 32 L20 86 L80 86 L80 32" stroke="#027DB3" stroke-width="2.5" stroke-linejoin="round" fill="none"/>

  <!-- Ground line -->
  <line x1="12" y1="86" x2="88" y2="86" stroke="#027DB3" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left display window -->
  <rect x="24" y="40" width="14" height="18" stroke="#027DB3" stroke-width="2" fill="none" rx="1"/>

  <!-- Right display window -->
  <rect x="62" y="40" width="14" height="18" stroke="#027DB3" stroke-width="2" fill="none" rx="1"/>

  <!-- Arched door outline -->
  <path d="M42 86 L42 60 Q 42 54 50 54 Q 58 54 58 60 L58 86" stroke="#027DB3" stroke-width="2.5" stroke-linejoin="round" fill="none"/>

  <!-- Door handle -->
  <circle cx="54" cy="72" r="1.5" fill="#027DB3"/>

  <!-- Mouse cursor (click indicator) - bottom right, overlapping window -->
  <path d="M66 52 L66 76 L72 71 L76 79 L80 77 L76 70 L83 69 Z" fill="#FFFFFF" stroke="#027DB3" stroke-width="2.5" stroke-linejoin="round"/>
</g>
</svg>
