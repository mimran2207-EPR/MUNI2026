<svg preserveAspectRatio="none" width="100%" height="100%" overflow="visible" style="display: block;" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="suppliers-portal">
  <!-- Briefcase body fill -->
  <rect x="18" y="32" width="64" height="50" rx="4" fill="#83DFE8" fill-opacity="0.4"/>

  <!-- Center divider strip fill (mint accent) -->
  <rect x="18" y="50" width="64" height="8" fill="#5CEBBE" fill-opacity="0.85"/>

  <!-- Briefcase outline -->
  <rect x="18" y="32" width="64" height="50" rx="4" stroke="#027DB3" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

  <!-- Handle outline (arched, on top) -->
  <path d="M38 32 L 38 24 Q 38 18 44 18 L 56 18 Q 62 18 62 24 L 62 32" stroke="#027DB3" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Center divider lines -->
  <line x1="18" y1="50" x2="82" y2="50" stroke="#027DB3" stroke-width="2"/>
  <line x1="18" y1="58" x2="82" y2="58" stroke="#027DB3" stroke-width="2"/>

  <!-- Lock at center -->
  <rect x="46" y="51" width="8" height="6" rx="1" fill="#FFFFFF" stroke="#027DB3" stroke-width="2"/>

  <!-- Document peeking out from the top of briefcase -->
  <rect x="33" y="28" width="14" height="6" fill="#FFFFFF" stroke="#027DB3" stroke-width="2" stroke-linejoin="round" rx="1"/>
  <line x1="36" y1="30.5" x2="44" y2="30.5" stroke="#027DB3" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="36" y1="32.2" x2="41" y2="32.2" stroke="#027DB3" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Approved checkmark badge (bottom right corner) -->
  <circle cx="76" cy="76" r="9" fill="#5CEBBE" stroke="#027DB3" stroke-width="2.5"/>
  <path d="M71.5 76 L 74.5 79 L 80.5 73.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</g>
</svg>
